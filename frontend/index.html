<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>问道 · 修仙文字奇缘</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>问道</h1>
      <div class="actions">
        <span id="save-name" class="save-name" title="当前存档"></span>
        <button id="saves-btn" class="ghost" title="存档 / 读档">存档</button>
        <button id="restart" class="ghost" title="另起新的一世">新的一世</button>
      </div>
    </header>

    <aside id="status-panel" class="status-panel empty" aria-label="身体状态">
      <h2 class="status-title">状态</h2>
      <div id="status-body" class="status-body"></div>
      <p class="status-empty">尚未入世</p>
    </aside>

    <main id="story" class="story" aria-live="polite"></main>

    <div id="drawer" class="drawer hidden">
      <div class="drawer-panel">
        <div class="drawer-head">
          <h2>历世存档</h2>
          <button id="drawer-close" class="ghost">关闭</button>
        </div>
        <ul id="save-list" class="save-list"></ul>
        <p id="save-empty" class="save-empty hidden">还没有存档，去开启第一世吧。</p>
      </div>
      <div class="drawer-mask"></div>
    </div>

    <form id="input-form" class="input-bar" autocomplete="off">
      <input
        id="action"
        type="text"
        placeholder="你会怎么做？顺着灵光，或自行其事……"
        disabled
      />
      <button id="send" type="submit" disabled>行动</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>

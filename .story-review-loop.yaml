service:
  base_url: http://127.0.0.1:8888
  health_path: /api/saves
  health_timeout_seconds: 8
  generation_timeout_seconds: 180
  start_command: cd backend && ../.venv/bin/python -m uvicorn main:app --reload --port 8888 --timeout-graceful-shutdown 3
  proxy_bypass: 127.0.0.1,localhost

session:
  strategy: dedicated
  save_name: 自动剧情验收

input:
  mode: auto
  auto:
    source: reviewer
    max_chars: 160
    policy:
      - 顺着已通过审查的场景和角色既定目标行动。
      - 优先选择可观察、可逆、风险适中的行动。
      - 不假定角色拥有尚未获得的知识、物品、能力或他人同意。
      - 未获玩家授权时，不作出叛宗、投靠、婚契、生死处置等不可逆重大选择。
  user:
    show_suggestions: true

review:
  timeout_seconds: 180
  invalid_report_retries: 1
  code_trace_on_fail: true
  require_regression_tests: true
  verdict_policy:
    fail_on_any_blocking_rule: true
    advisory_failure_is_blocking: false
  rules:
    - id: player-action-alignment
      enabled: false
    - id: player-agency
      enabled: false
    - id: director-contract
      enabled: false
    - id: causal-continuity
      enabled: false
    - id: progression-grounding
      enabled: false
    - id: item-provenance
      enabled: false
    - id: persisted-state-consistency
      enabled: false
    - id: knowledge-boundary
      enabled: false
    - id: suggestion-boundary
      enabled: false
    - id: prose-quality
      enabled: false
    - id: escape-plot-progress
      enabled: true
      severity: blocking
      description: 每轮逃跑剧情必须产生可识别的实质推进，例如改变主角与追兵的距离或视线、获得或失去遮蔽、进入新路线或位置、改变追兵部署、风险升级或缓解、推进明确的脱离条件。若只是重复奔跑、躲藏、追逐或危险描述，而逃跑态势与上一轮实质相同，则判定不通过。
    - id: escape-plot-scope
      enabled: true
      severity: blocking
      description: 从追逐或逃跑事件开始，直到正文给出客观脱险结果前，每轮核心内容必须继续服务于逃跑主线。允许观察追兵、选择路线、隐蔽、短暂喘息、制造障碍和反制追踪；不得在尚未脱险时切换到修炼、闲聊、寻宝、日常活动或其他与脱险无直接关系的剧情。客观脱险后结束此项持续约束，不要求继续逃跑。

stop:
  on_first_fail: true
  on_review_error: true
  on_generation_error: true
  max_accepted_turns: null

artifacts:
  directory: /tmp/story-review-loop
  keep: false
